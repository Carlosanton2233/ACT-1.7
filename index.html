<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.6 - Etiquetas de contenido y texto</title>
</head>
<body>
<h1> Etiquetas de contenido y texto by Carlos</h1>
<section id="contenido">
        <h2>Contenido</h2>
        <p>Un párrafo sencillo.</p>
        <hr>
        <pre>Texto preformateado</pre>
        <blockquote>Una cita corta.</blockquote>
        <div>Un bloque div.</div>
        <dl>
            <dt>Título</dt>
            <dd>Descripción corta.</dd>
        </dl>
        <figure>
            <img src="foto.png.png" alt="Foto">
            <figcaption>Texto de la foto.</figcaption>
        </figure>
    </section>
    <section id="listas">
        <h2>Listas</h2>
        <ol type="A" start="1">
            <li>Primer elemento</li>
            <li>Segundo elemento</li>
        </ol>
        <ol reversed>
            <li>Tres</li>
            <li>Dos</li>
            <li>Uno</li>
        </ol>
        <ul>
            <li>Elemento A</li>
            <li>Elemento B</li>
        </ul>
    </section>
</body>
</html>
